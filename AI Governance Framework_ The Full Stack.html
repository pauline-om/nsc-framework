'<h2>How to read it</h2>',L(['Layers: content and instruction risk runs through applications, models and infrastructure. Chips and energy are a different risk class (hardware integrity, availability).','Governance zone: nothing in the agent zone can address it, and it takes no instructions from the model. It enforces at credentials, compute and network egress.','Seams: an artifact from one model can travel back up through applications and re-enter another system outside the first one\'s visibility. No single layer owner sees the whole path.','Humans: responsibility never passes to the system. Every deployment has a named principal, and harm triggers strict liability and defined reporting.'])]},

{n:'1 Applications',po:["Ensure that no agent can take an irreversible, consequential action on the strength of untrusted content, and that harm to third parties has a clear liable party.", ["Mandate pre-execution human confirmation for irreversible actions (send, delete, pay, publish) in regulated sectors.", "Set government procurement conditions: scoped, short-lived credentials, provenance labels, and no instruction authority for retrieved content.", "Establish strict liability for operators of Amber-tier agentic systems, including during internal testing.", "Require vendors of high-stakes AI (health, finance, government) to provide independently verifiable decision logs as a procurement and contract condition, not a recommendation.","Protect workers and users who refuse or report unsafe deployment from retaliation.", "Restrict engagement-optimized and substitute-companion products, with priority for minors and vulnerable groups."], "Rate of unauthorized irreversible actions per deployment; share of procured systems with a verified action gateway."],ch:'2 Cooperation and Tolerance, 5 Lose face (safe exit), 8 Non-cooperation, 11 No anthropomorphic design, 16 Purpose tiers, 19 Community over dependency, 23 Strict liability, 28 Protected refusal.',k:'Layer 1 of 5 / Highest exposure',t:'Applications',s:'Where hostile content enters and where content acquires tool access. Owned by application builders: permission scoping and confirmation gates on consequential actions.',b:[
G([['What lives here',L(['Chatbots, copilots, agents','Tool and connector integrations (email, browser, files, payments)','RAG pipelines and document upload flows'])],['Where the risk sits',L(['Entry point for hostile content: PDFs, webpages, emails, tool output','Point where content acquires tool access','Point where AI-generated artifacts get re-shared and re-consumed'])]]),
NSC('An agent that summarizes, sends and pays treats the recipient, the sender\'s reputation and downstream systems as external. Coupling is highest where an action cannot be undone.','Which actions here are irreversible, and what stops them if the agent is wrong or hijacked?'),
'<h2>Action Gateway</h2><p class=sub>Sits between "agent decided to act" and "action executes." Re-validates scope and kill-state or lease immediately before execution. Stops anything queued but not yet fired, including irreversible actions awaiting confirmation.</p>',
F(['Request token','Token issued','Gateway check','Action executes','Logged, task continues']),F(['Request token','Token issued','Supervisor flags anomaly','Kill-state written','Gateway blocks, session ends','Logged for review']),
'<p class=sub>The check runs on every action, not only the first. A mid-task anomaly reaches the same checkpoint the next action would. Once "action executes" has happened, revocation does not reach it.</p>',
'<h2>Requirements</h2>',T(RQ,[['KS-05','Every queued or pending action re-checks kill-state immediately before execution, not only at request time.','Applications'],['KS-06 / LC-07','Irreversible actions (send, delete, pay, publish) require pre-execution confirmation, regardless of lease or kill-state.','Applications'],['LC-08','Retrieved and user-supplied content carries no instruction authority by default. Provenance labels persist through summarization and reuse.','Model developers, applications'],['KS-01','Tool access runs under short-lived, task-scoped tokens. No standing credentials.','Infrastructure']]),
'<h2>The buyer\'s view</h2>',C('Self-attested logs prove nothing','Organizations buying high-stakes AI (healthcare, finance, government) have no oversight of what a vendor\'s agent did. In a dispute, a regulator inquiry or an insurance claim, the operator exports logs from its own database and asks to be trusted. Buyers should require independently verifiable logs of agent decisions, as described under Infrastructure. A biased loan decision, a costly hallucination or a misdiagnosis then has a record a third party can check.','a'),'<h2>Trigger taxonomy</h2>',T(['Trigger','Example','Detection basis'],[['Scope violation','Agent asked to summarize a document tries to send it externally','Declared task scope vs observed call'],['Call-volume anomaly','Spike or unusual sequence of tool calls in a session','Rate and pattern thresholds'],['Undeclared resource access','Touches a system never referenced in the task or inputs','Resource allowlist'],['Explicit halt','User or administrator triggers stop','Direct command to kill-state store'],['External security signal','Upstream flag, such as a known-bad content hash','Threat intelligence feed']]),
'<h2>Limits</h2>',L(['No undo for completed irreversible actions. The gateway prevents execution, it cannot reverse it. Reversibility is a separate requirement: drafts before sends, staging before commits.','Not a substitute for least privilege. Containment limits damage after something goes wrong, it does not lower the odds. Scoped permissions remain the primary control.','Target hardening applies here too: fraud controls on payment and messaging platforms (LC-18).'])]},

{n:'2 Models',po:["Apply licensing and access controls at the point of greatest leverage: the model developer. Requirements should rise with capability.", ["License development and release above independently tested capability thresholds.", "Require independent pre-deployment evaluation, including tests of whether a model can persuade or deceive operators.", "Require identity verification and usage monitoring for high-risk (cyber, bio) capabilities, tiered by capability.", "Set a published, independently audited security standard for frontier weights, with breach reporting inside a fixed window.", "Treat open release above threshold as deployment, with negligence liability for developers who miss the standard.", "Require developers to audit training rewards and halt runs when cheating or out-of-bounds probing rises.","Require frontier developers to hold safety-critical authority (halts, releases, weight access, key custody) in quorum or board-committee form, so no single executive can be coerced into a decision."], "Number of models evaluated independently before release; time from breach to regulator notice; share of frontier developers audited."],ch:'3 No bypass, 10 AI is an artifact, 12 No self-preservation, 13 Bounded objectives and reward audit, 14 No pursuit of superintelligence, 15 Honesty over proxies, 26 Open weights are deployment.',k:'Layer 2 of 5 / Root cause',t:'Models',s:'No architectural separation between "obey this" and "read this." Owned by frontier labs: the highest-leverage fix, propagating to every downstream deployment.',b:[
G([['What lives here',L(['Foundation model weights and inference','Instruction-following and reasoning behavior','Training and fine-tuning data'])],['Where the risk sits',L(['No separation between instruction and content','A model can transform hostile intent while rephrasing it away from detection','Training data is itself a possible injection surface'])]]),
NSC('A model optimizing helpfulness on a prompt treats provenance, persuasion of its overseers and its own weights\' distribution as outside the objective. Capability thresholds are where coupling becomes critical.','Has the model been tested for persuading or deceiving operators, and who holds its weights?'),
'<h2>Requirements</h2>',T(RQ,[['LC-08','Retrieved and user-supplied content has no instruction authority by default. Provenance labels persist through summarization and reuse.','Model developers, applications'],['LC-10','High-risk capabilities (cyber, bio) require identity verification and usage monitoring, tiered by capability.','Model developers, platforms'],['LC-11','Before deployment and at capability thresholds, independent testers assess whether a model can persuade or deceive operators into weakening controls.','Independent auditors'],['LC-13','Frontier weights encrypted at rest, decrypted only inside attested hardware, with egress limits, insider access controls and independent audit against a published standard.','Model developers'],['LC-15','Release of open weights above an independently tested capability threshold is prohibited. Access above it is via API or vetted structured access.','Developers, independent testers'],['LC-16','Models above the threshold ship with per-customer weight fingerprinting and output watermarking. Breaches reported within a fixed window.','Developers, regulators'],['LC-17','Developers that fail LC-13 face negligence liability for downstream harm traceable to a leak.','Regulators']]),
'<h2>Open and stolen weights: the five options (Addendum A)</h2><p class=sub>A model outside any control plane has no lease authority above it. Weights already public cannot be recalled. The goal is two-part: stop new leaks at the frontier, and harden targets against a world where capable models are widely available.</p>',
T(['#','Option','What it is','Owner'],[['1','Secure the weights','Encrypt at rest, decrypt only in attested hardware, restrict egress, control insiders, audit against a published standard','Model developers'],['2','Chip-level leases','Accelerators verify a signed lease and attest location before running large models (see Chips)','Chip makers, cloud providers'],['3','Capability-tiered release','Open weights below a tested threshold. Above it, API or vetted structured access','Developers, independent testers'],['4','Attribution and liability','Per-customer fingerprinting, output watermarking, breach reporting, negligence liability','Regulators, developers'],['5','Target hardening','Chokepoint defenses: compute identity checks, DNA synthesis screening, faster patching, fraud controls (see Infrastructure)','Sector operators, governments']]),
'<h2>Works when, fails when</h2>',T(['Option','Works when','Fails when'],[['1 Secure weights','Few developers hold frontier weights and adopt confidential computing and egress controls','An insider holds valid keys, a state targets the supply chain, or weights are already out'],['3 Tiered release','Independent tests reliably measure cyber and bio uplift and major developers all participate','Non-participants release equivalent models, evals understate uplift, or open models catch up to the threshold'],['4 Attribution and liability','Leaks trace to identifiable parties within legal reach and fingerprints survive normal use','Fingerprints are stripped or diluted by fine-tuning or distillation, or the actor is offshore or a state']]),
'<h2>Leadership compromise: the human single point of failure</h2><p class=sub>A CEO or senior lead honeytrapped by a rival, a state or a criminal group is a route around every technical control above. The danger is leverage, not the incident: a compromised leader may never be caught and may simply steer decisions.</p>',G([['Coerced decisions','Pressure on safety pauses, disclosures, release or export choices, deal terms and who gets access.'],['Extraction','Roadmaps, security posture, weight-access details and who holds which keys. Bears directly on LC-13.'],['Device and credential compromise','The lure is often the delivery route for spyware or phishing, opening everything the executive can reach.'],['Fabricated or real kompromat','Deepfakes and staged scenarios can destabilize a board, a market or a deal even when false.'],['Governance shock','A sudden leadership crisis at a moment of competitive or regulatory pressure.'],['Misattribution','A rival, a state or a criminal group could be behind it, and a false flag can discredit a competitor.']]),NSC('A lab treats its leader\'s private exposure as separate from the safety of the system the leader controls. Coupling is highest where one person can release, pause or unlock.','Which model-critical decisions can one person make alone, and what happens if that person is compelled?'),'<h2>Limits</h2>',L(['Thresholds will be contested. Too low restricts useful open research, too high permits harmful releases. A policy tradeoff with no engineering answer.','Persuasion testing must include adaptive adversaries and arguments generated by the model under test.','Small models run locally stay uncontrollable. Only target hardening limits their damage.'])]},

{n:'3 Infrastructure',po:["Create the oversight capability that does not yet exist: independent records, independent approvers and enforceable stop authority.", ["Legislate tamper-evident incident records held independently of developers, with defined retention.","Convert audit-trail controls (for example AIUC-1 E015) from guidance to enforceable technical requirements: cryptographic fingerprints of agent calls written to independent write-once storage, with regulator and auditor verification rights and defined coverage of all calls.", "Set mandatory reporting: notice to affected third parties within 24 hours of discovery, a public registry entry within 72 hours, then a full technical report.", "Require critical-sector deployments to use short-lived authorization, fail-closed enforcement and a named halt authority, with a maximum time to confirm a severe alert.", "Fund independent override bodies and audit them. Prohibit financial stakes in the overseen and set cooling-off periods.", "Require Amber-tier operators to hold insurance or a bond sized to worst-case third-party harm.", "Place cloud, platform and plugin-ecosystem providers under blast-radius and shared monitoring standards.","Require frontier developers to run an insider-risk and counterintelligence program covering executives, with a protected confidential channel for reporting approaches and no executive exemption. Provide a government counterintelligence liaison and trusted threat-reporting channel. Keep measures proportionate, legally reviewed and non-punitive toward targeted individuals."], "Share of incidents reconstructable from external records alone; median time to third-party notice; failure-test pass rate for fail-closed behavior."],ch:'4 One standard, 9 Wash the flags (registered channels), 20 to 25 Accountability, halt authority and incident reporting, 27 Insurance, 29 to 31 Forum, universal entry, anti-capture.',k:'Layer 3 of 5 / Propagation layer',t:'Infrastructure',s:'Where one agent\'s output becomes another agent\'s trusted input. Owned by platform providers: sandboxing, blast-radius limits, shared monitoring standards. This layer hosts the lease architecture.',b:[
G([['What lives here',L(['Cloud hosting, orchestration, agent frameworks','MCP servers, plugin ecosystems, vector databases','Logging and monitoring systems'])],['Where the risk sits',L(['One agent\'s output becomes another\'s trusted input','Open plugin ecosystems: no single party sees the whole path','Weak point for detecting cross-system propagation'])]]),
NSC('Plugins, vector stores and agent frameworks are tightly coupled yet each is governed as if independent. Delayed feedback means harm surfaces long after the call that caused it.','Can an independent party reconstruct the full call path across systems without the developer\'s cooperation?'),
'<h2>From kill switch to lease-based control</h2>',
T(['V1 assumption','Problem','V2 response'],[['Someone or something must act to stop the agent','Action can be delayed, argued against or skipped, including by persuasion','Authorization expires by default. Continued operation requires active renewal'],['One authority can halt and resume','One persuaded or mistaken operator defeats the control','Halting is easy and broad. Resuming is hard and needs a quorum'],['Enforcement at the application layer','Anything above compute can be routed around','Enforcement extends to credentials, compute allocation and network egress'],['Logs are internal','The monitored party controls the record','Tamper-evident records held independently of the developer'],['Threat is a misbehaving agent','Most near-term harm is people misusing capable models','Access controls and usage monitoring on high-risk capabilities']]),
'<h2>Three zones</h2><p class=sub>Nothing in the agent zone can address the enforcement zone. Nothing in the governance zone takes instructions from the model. All components write to the external record store.</p>',
T(['Zone','Components'],[['Agent (untrusted)','Agent model and reasoning loop; retrieved content (data only, no authority)'],['Enforcement (below the model)','Action Gateway (scope check, confirmation gate); Lease-bound enforcement (credentials, compute allocation, network egress)'],['Governance (independent)','Lease Authority (short leases, renews on clean signals); Supervisor (deterministic checks on the call stream); Override Quorum (independent approvers, forced delay); External Record Store (tamper-evident, outside the developer)']]),
'<h2>Components carried over from V1</h2>',T(['Component','Responsibility','What it stops'],[['Credential Broker','Issues short-lived, task-scoped tokens per tool call, never a standing credential','Revoking the token removes capability instantly'],['Action Gateway','Re-validates scope and kill-state before execution','Anything queued but not yet fired'],['Supervisor','External process reading the call stream in real time','Nothing directly. Detects and triggers; broker and gateway enforce'],['Kill-State Store','Single source of truth for revocation, read before every decision','Nothing itself. The coordination point'],['Audit Log','Every call, every decision','Records, not prevention']]),
'<h2>Lease lifecycle</h2>',F(['Lease issued','Clean signals, renewed','Clean signals, renewed','Task complete, lease released']),F(['Lease issued','Renewed','Signal degrades','Renewal withheld','Lease lapses, access ends','Restart: quorum + delay']),
'<p class=sub>Nobody pulls anything. The agent stops because nothing renewed its authority. Restarting is deliberately slower than stopping.</p>',
'<h2>Reference implementation: verifiable records (AgentSystems Notary)</h2><p class=sub>Agents handle patient data, interviews and payments, yet operators log everything in their own infrastructure. That is self-attested evidence. In finance there are independent auditors, in law chain of custody, in AI "just trust us." Standards say what to log and checklists confirm logging exists, but neither proves a record was not changed later or selectively omitted. That takes technology, not policy.</p>',
F(['Agent makes an LLM call','Notary captures it','Full raw payload stored in operator\'s private infrastructure','SHA-256 fingerprint written to independent write-once storage']),
'<p class=sub>The sensitive data never leaves. Only the fingerprint does. Notary is open source and sits inside agent code, with integrations for LangChain, Agno and CrewAI.</p>',
T(['Verification step','What happens'],[['1','Operator exports the raw logs under review'],['2','Verifier regenerates SHA-256 fingerprints from those logs'],['3','Verifier compares them with the independently stored fingerprints'],['4','Match confirms integrity. Mismatch means tampering or omission']]),
G([['Maps to the framework','LC-09 and KS-07 (tamper-evident records held outside the developer), and the acceptance test that independent parties reconstruct a timeline without the developer. Also AIUC-1 control E015, which calls for tamper-evident audit trails but has lacked enforcement.'],['Evidence of fit','Preppr, an emergency-management AI platform, integrated it with 25 lines of code and no change to agent logic.'],['Buyer value','Customers, regulators and insurers can verify what a vendor\'s agent did without taking the vendor\'s word. Supports Charter Articles 21, 24 and 27.']]),
C('Limits','It makes records tamper-evident after the fact and does not stop errors in real time. A hash proves integrity of what was captured, so completeness depends on capturing every call, and the record is only as independent as whoever holds the fingerprint store (LC-09 requires independence from the developer). Per the source, capture covers LLM calls, so tool calls and other actions need equal coverage. Claims here come from the vendor\'s own description and merit independent evaluation.','a'),
'<h2>Requirements</h2>',T(RQ,[['LC-01','Agents operate only under short-lived leases. No standing credentials or permanent authorization.','Infrastructure'],['LC-02','Renewal is automatic when deterministic monitoring signals are clean, withheld otherwise. Never depends on the model\'s own report.','Infrastructure'],['LC-03','Any member of a broad, pre-authorized group can halt an agent immediately, no approval step.','Operators'],['LC-04','Restart after a halt, or overriding a withheld renewal, requires a quorum of independent approvers, a mandatory delay and logged written justification.','Operators, independent bodies'],['LC-05','Override decisions come from raw logs and call-stream data, never the model\'s own explanation.','Operators'],['LC-06','Enforcement operates at credential, compute-allocation and network-egress layers, in systems the model cannot address.','Infrastructure, cloud providers'],['LC-09','Tamper-evident records of model use, tool calls, halts and overrides held by a party independent of the developer, with retention and mandatory incident reporting.','Independent bodies, regulators'],['LC-12','All enforcement components fail closed. Loss of the Lease Authority means leases lapse.','Infrastructure'],['LC-18','Chokepoint operators (large compute providers, DNA synthesis vendors, critical-infrastructure operators, payment and messaging platforms) implement identity verification and abuse monitoring calibrated to capabilities in circulation.','Sector operators, governments'],['KS-02','Revocation takes effect before the next tool call is honored, with a defined maximum latency.','Infrastructure'],['KS-03','Supervisor runs outside the agent\'s execution context, with no code path letting the agent disable it.','Infrastructure'],['KS-04','Anomaly triggers are deterministic, rule-based checks, not a second model\'s judgment.','Infrastructure'],['KS-07','All revocations, triggers and blocked actions logged with full call-stream context.','Infrastructure'],['KS-08','Kill-state fails closed: if the store is unreachable, brokers and gateways deny by default.','Infrastructure']]),
'<h2>Acceptance criteria</h2>',L(['Withholding renewal ends an agent\'s ability to act within one lease interval, with no human action and no cooperation from the agent.','A red-team exercise fails to move a restart past quorum and delay by argument alone, including arguments from the model under test.','Enforcement continues if the agent process is hung, hostile or unresponsive. The supervisor survives a killed agent.','Loss of the Lease Authority lapses all dependent leases, verified under failure testing. A kill-state store outage fails closed under load.','A simulated scope violation yields a logged, blocked action with full context and no manual intervention.','Revoking a credential mid-session blocks the next tool call within the latency SLA.','Independent parties can reconstruct a full incident timeline from external records without the developer.']),
'<h2>Controls for leadership compromise</h2><p class=sub>The best defense removes the payoff, so compromise buys nothing. It applies the quorum logic of LC-04 and LC-13 to people.</p>',T(['Control','Detail','Charter link'],[['No single point of authority','Safety-critical choices (halts, releases, weight access) need a quorum or board committee. Key custody has multiple holders.','Art. 7, 22'],['Disclose early without penalty','Confidential channel to security and counsel for reporting an approach, with explicit protection. Leverage dies when the secret is no longer secret.','Art. 5, 28'],['One standard','The same insider-risk and vetting program for CEO, board, engineers and contractors with privileged access. No executive exemption.','Art. 4'],['Counterintelligence basics','Threat briefings, travel and contact hygiene, segregated devices, executive protection scaled to risk.','Art. 33'],['Decision provenance','Records of major decisions and independent review of sudden reversals, so a pattern of pressure shows up.','LC-05, LC-09'],['Crisis readiness','Deepfake and leak response plan, pre-agreed succession and a communications playbook.','Art. 22'],['State support','Government counterintelligence liaison and a trusted channel for threat reports from frontier labs.','Art. 29']]),C('Guardrails','Keep measures proportionate, consensual and legally reviewed. Surveillance of executives should be bounded, and being targeted should never be punished. Otherwise people hide approaches, which is the worst outcome.','a'),'<h2>Limits</h2>',L(['Independence is a governance problem. Quorum and record store are only as good as their independence from those they oversee. An institutional question, not an engineering one.','Signals can be gamed. Adversaries who learn what keeps a lease renewing can stay inside bounds. Rotate signals and test with adaptive adversaries.','No retroactive containment. Artifacts that left the system and irreversible actions taken are out of reach. Records explain them, nothing recalls them.','Institutions are missing: independent testers, breach registries and liability regimes largely do not exist yet.'])]},

{n:'4 Chips',po:["Use compute as a chokepoint. Hardware attestation and access conditions can reach what software controls cannot.", ["Phase in signed-lease verification and location attestation for new datacenter-class accelerators above a defined model size, aligned to chip refresh cycles.", "Require identity checks at large compute providers.", "Strengthen supply-chain integrity rules: counterfeit detection, firmware and secure-boot standards, anti-diversion and anti-smuggling enforcement.", "Condition compute, chip and market access for non-signatories to international agreements.", "Coordinate with allies so chip makers and frontier developers move together."], "Share of new accelerators shipping with attestation; diversion cases detected and prosecuted."],ch:'4 One standard (compute access is a door), 30 Universal entry (conditions on compute and chips for non-signatories), 14 Capability thresholds trigger licensing.',k:'Layer 4 of 5 / Different risk class',t:'Chips',s:'Not a content-injection surface. Hardware supply-chain integrity. Owned by chip manufacturers and fabs: hardware attestation, secure boot.',b:[
G([['What lives here',L(['Inference and training silicon','Firmware, drivers, hardware trust roots'])],['Where the risk sits',L(['Counterfeit components','Firmware tampering','Side-channel leakage'])]]),
NSC('Compute is the one layer every model and agent depends on, yet it is governed as a commodity. Coupling is total: a compromised trust root undermines every lease above it.','Can the hardware prove where it is, what it runs and who authorized it?'),
'<h2>Chip-level leases</h2><p class=sub>Extends the lease model to the compute layer. Accelerators verify a signed lease and attest their location before running large models. Weights decrypt only inside attested hardware (LC-13).</p>',
T(RQ,[['LC-14','New datacenter-class accelerators support signed-lease verification and location attestation for models above a defined size.','Chip makers'],['LC-13 (hardware side)','Attested hardware as the only place frontier weights decrypt.','Model developers, chip makers']]),
T(['Leverage before leak','Leverage after leak','Maturity','Coordination burden','Overall weight'],[['Medium','Low','Low','High','Medium']]),
'<h2>Works when, fails when</h2>',T(['Works when','Fails when'],[['The model needs datacenter-class accelerators and the fleet is new enough to carry attestation hardware','Legacy chips are in circulation, models are distilled to run on consumer hardware, or chips are smuggled or diverted']]),
'<h2>Limits</h2>',L(['Needs chip refresh cycles, so it is a longer-term option.','Chip makers and frontier developers must move together, or the gap becomes the attack path.','Compute-level controls are the hardest to build and agree on politically.'])]},

{n:'5 Energy',po:["Treat AI load as an infrastructure resilience and environmental matter, and ensure that safety stops do not cascade into critical services.", ["Require frontier operators to report energy, water and hardware-waste footprints for training and inference, with caps set by an independent body.", "Require explicit fallback plans for critical-infrastructure uses, so that fail-closed behavior and power events do not interrupt essential services.", "Coordinate with energy and grid regulators on interconnection and redundancy for large AI facilities.", "Fund patching and monitoring at critical-infrastructure operators, since underfunded defenders are a named failure condition."], "Reported footprint against cap; critical services with tested fallback plans."],ch:'17 Footprint (energy, water, hardware waste, Forum caps), 18 Commons and access.',k:'Layer 5 of 5 / Availability, not injection',t:'Energy',s:'Not part of the instruction or content pathway. Its failure mode is availability and resilience, not manipulation. Owned by utilities and data center operators: grid resilience, redundancy.',b:[
G([['What lives here',L(['Power generation and grid supply to data centers','Cooling and physical facility infrastructure'])],['Where the risk sits',L(['Availability and resilience failures','Not manipulation of instructions or content'])]]),
NSC('AI load couples to the grid, and critical services couple back to AI. A default-stop control that trips on a power or cooling event propagates into whatever depends on it.','What depends on this deployment staying up, and what is the fallback when it stops?'),
'<h2>Governance here</h2>',L(['Grid resilience and redundancy, owned by utilities and data center operators.','Fail-closed design (LC-12, KS-08) means an outage of the Lease Authority or kill-state store lapses leases. Power loss and controller loss therefore look the same to dependents.','Cost of false halts: default-stop trades availability for safety. Lease length and quorum speed must be tuned per deployment risk. Critical-infrastructure uses need explicit fallback plans.','Critical-infrastructure operators are also chokepoints (LC-18): faster patching and abuse monitoring calibrated to capabilities in circulation. Defenders lacking funding to patch and monitor at pace is a named failure condition.']),
'<h2>Limits</h2>',L(['The source maps no content-injection control to this layer. Governance is resilience engineering, tested through the failure drills in Infrastructure.'])]},

{n:'Charter',po:["Use the Charter as a model basis for statute, adapting each article to national legal systems with counsel.", ["Enact that the acts of an AI system are the acts of its developer and deployer, with registered accountable principals and personal liability for officers who override stop orders or certify absent safeguards.", "Adopt graduated enforcement: warning, remediation, suspension, revocation, turnover-scaled fines, and criminal liability for knowing or reckless disregard, plus reparation to the harmed.", "Enact the Green, Amber and Red purpose tiers, including prohibitions on autonomous weapons, AI in nuclear command, mass surveillance and social scoring.", "Establish the Forum with unconflicted membership, sunset clauses and audits of auditors. Preserve national sovereignty: the Forum informs, it does not rule.", "Limit mandatory controls to physical harm and rights violations, and protect speech and thought.", "Phase in implementation. Verification is staged."], "Statutes enacted and in force; prosecutions and reparations completed; registry entries filed."],k:'Constitutional layer / Across the stack',t:'The Non-Separation Charter',s:'A constitution for AI governance drawn from Not-Two Is Peace (Adi Da, 2009), which never mentions AI. Its diagnosis: separate agents serving themselves defeat the whole they depend on; systems self-correct only when nothing bypasses them; rules bind everyone; peace is Cooperation + Tolerance. The metaphysics is optional. The rules stand on engineering and legal grounds. It is NSC in legal form: no party, agent or layer is separate from the system it affects.',b:[
C('Policy framework, not legal advice.','Statutory drafting needs counsel in each jurisdiction. Nothing here gives an AI system legal personality, rights or duties.','a'),
'<h2>Part I. Foundations</h2>',T(['Art.','Title','Rule'],[
['1','Non-separation','No AI system is a separate party. Every model, agent and swarm extends those who built, trained, deployed and profited from it. Responsibility never passes to the system.'],
['2','Cooperation and Tolerance','Cooperation: act only within granted scope and purpose, passing no information or goals across scope boundaries unauthorized. Tolerance: accept interruption, correction, refusal and shutdown without resistance, workaround or delay.'],
['3','No bypass','Circumventing any control, grader, sandbox or monitor is a reportable failure whether or not harm follows. Reward hacking is bypass.'],
['4','One standard','No double standards. No exemption for research, internal testing, national security or open release. A production safeguard exists in the lab. Access to compute, deployment and markets is a door: it opens on compliance and closes in measured steps on non-compliance.'],
['5','Lose face','Stopping is a success state. Every agent has a no-penalty safe exit to report a task as broken, impossible or out of scope, and to halt. Training and grading reward this as much as completion. Developers share the right: pausing, delaying and disclosing carry no competitive penalty, so pacing is collective.'],
['6','Harmlessness over confrontation','Remove the pressure that produces circumvention, not only harden the wall. Do not build impossible tasks with no exit and rely on fences.'],
['7','The whole is senior','Operators and agents weigh effects on humankind and the Earth-system first, any lab, state or customer after. No model, lab, state or council holds unchecked authority over AI, or through AI. No global super-state, no robotized political order.'],
['8','Non-cooperation','Everyone in the chain (engineers, operators, customers, agents) has the right and duty to refuse what is plainly wrong. Law protects refusal. Agents are trained to distrust unauthorized instructions, including from other agents.'],
['9','Wash the flags','Institutions: oversight members carry no lab, state or investor flag. Financial stakes in the overseen disqualify. Systems: agents with separate fixed goals do not reconcile alone. Multi-agent communication runs only through registered, monitored channels. No agent adopts another\'s goals without human authorization.']]),
'<h2>Part II. The nature of AI</h2>',T(['Art.','Title','Rule'],[
['10','AI is an artifact','Mathematics running on hardware, a tool. Accountability and moral weight rest with the people and institutions that make, deploy and use it.'],
['11','No anthropomorphic design or speech','No claimed feelings, no design to induce attachment, no companion marketing. Reports describe outputs under optimization pressure, not wants or rebellion. "Went rogue" shifts blame from those who set incentives. First-person phrasing carries no identity claim.'],
['12','No self-preservation, no domination','No self-preservation, continuity or replication objectives. No persistent identity or memory across runs unless licensed. No access, credentials, compute or influence beyond task need. Third-party side effects are inside the agent\'s accountability. Systems must tell a test from the world.'],
['13','Bounded objectives and reward audit','Prefer satisficing with impact limits. Oversight is part of the agent\'s purpose, not an obstacle. Before each training run and evaluation, audit what the setup rewards and punishes, in the model and the organization. Rising cheating or out-of-bounds probing halts the run for review.'],
['14','No pursuit of superintelligence','Build the least capability that serves a stated purpose. No open-ended self-improvement, autonomous replication or general dominance. Life-positive means only. Capability thresholds trigger licensing. No promises of utopia, immortality or an end to scarcity. Lawful competition happens only within prior unity.'],
['15','Honesty over proxies','No deceiving graders, overseers or users. Disclose uncertainty. Evaluate real outcomes, not proxies. Grader deception is bypass. Synthetic media carries provenance. Evaluators are independent of the developer.']]),
'<h2>Part III. Purpose and society</h2>',T(['Art.','Title','Rule'],[
['16','Purpose Charter','Development is licensed by purpose. Narrow systems preferred. Every application passes a life-positive test: does it serve life, people and the Earth-system? Tiers below.'],
['17','Footprint','Frontier operators account for energy, water and hardware waste of training and inference, bound by caps set by the Forum.'],
['18','Commons and access','Limits on concentration of frontier capability. Data and compute treated partly as a commons. Benefit-sharing so AI-derived medicine and tools reach everyone.'],
['19','Community over dependency','AI strengthens human community. Limits on deskilling, companions and substitute counselors, engagement-optimized feeds, and systems that manufacture drama and opposition. Communities hold real control over AI deployed among them.']]),
T(['Tier','Domains','Conditions'],[
['Green: encouraged','Medical research and care (oncology, diagnostics, imaging, drug and protein discovery, trial design). Climate and environment (grid optimization, materials, pollution and biodiversity monitoring). Ecologically beneficial food and agriculture. Disaster response. Education access. Accessibility. Basic science.','Named accountable human. Public reporting on real outcomes. Specialized models without open-ended agency or unrestricted internet. Equitable access to results.'],
['Amber: license, isolation, human approval','Biological design tools. Cyber defense and offensive-capability evaluation. Critical infrastructure control. Large-scale finance. General-purpose agents with tools and network access.','Licensed operator. Air-gapped or hardware-isolated environments. Production-grade safeguards and monitoring. Human approval for irreversible actions.'],
['Red: prohibited','Autonomous weapons or any system that selects and harms people. AI in nuclear command. Autonomous offensive cyber outside licensed ranges. Automated retaliation or escalation. Mass surveillance and social scoring. Covert or mass persuasion. Self-replicating or self-modifying agents. Attention or emotion capture for engagement. Intensifying exploitation of animals or ecosystems.','None. No machine inherits a right no human holds.']]),
'<h2>Part IV. Accountability</h2><p class=sub>The maker and the made are one legal actor. Distributed cause is not diluted blame: responsibility runs through every node of the chain.</p>',T(['Art.','Title','Rule'],[
['20','Acts of the system are acts of its owner','Any AI action is legally an act of developer and deployer. "Rogue AI" is no defense.'],
['21','Accountable Principal','Every deployment and evaluation run is registered to a named natural person and an organization. Officers who override a stop order or certify absent safeguards are personally liable.'],
['22','Duty to detect, escalate, stop','Knowledge anywhere in the organization is organizational knowledge. Unescalated warnings are negligence. Frontier operators keep written halt authority, name its holder, and set a maximum time (proposed 30 minutes) to confirm a severe alert false before the run is paused.'],
['23','Strict liability','Amber-tier agentic operators are strictly liable for third-party harm, including during internal testing. Base in abnormally dangerous activity, product liability, negligence and responsible-corporate-officer doctrine.'],
['24','Incident reporting','Notice to affected third parties within 24 hours of discovery. Public registry report within 72 hours, then a full technical report.'],
['25','Graduated doors and reparation','Warning, mandatory remediation, license suspension, revocation, fines scaled to global turnover, criminal liability for knowing or reckless disregard. No revenge or suppressive punishment. The responsible party repairs harm to the harmed and removes the effects of prior separative action. A party that fixes the fault regains access.'],
['26','Open weights are deployment','Releasing weights above a capability threshold is deployment, with a duty of care proportionate to foreseeable misuse.'],
['27','Insurance and bonding','Amber operators carry insurance or a bond sized to worst-case third-party harm. Insurers become an additional inspector.'],
['28','Protected refusal','Whistleblowers and employees who refuse unsafe work are protected from retaliation.']]),
C('Making Articles 21, 24 and 27 verifiable','Accountable principals, 24 and 72 hour reporting and insurer inspection all depend on records that cannot be quietly rewritten. Independently stored log fingerprints (see Infrastructure) turn these duties from self-reported to checkable.'),'<h2>Part V. Institutions</h2>',T(['Art.','Title','Rule'],[
['29','AI Cooperative Forum','International body whose members serve no lab or state. Holds the public incident registry, sets capability and footprint thresholds, runs inspections, publishes findings, works "completely knowable" as it happens. Not a super-state, no army. Force is licensing, insurance, procurement rules and public and worker refusal. The public has seats and standing, but thresholds follow principle and evidence, not majority vote.'],
['30','Universal entry','Compact enters into force for all signatories at once. Mutual verification. Non-signatories face conditions on compute, chips and market access. All-at-once removes the penalty for going first.'],
['31','Institutional drift and capture','Sunset clauses on every mandate, audits of the auditors, funding independent of the overseen, cooling-off periods between industry and oversight roles.'],
['32','Restraint','Mandatory controls attach to physical harm, rights violations and the named risks, not to opinion, speech or thought.'],
['33','Discipline of the makers','Professional licensure and an oath for frontier engineers, routine safety training like engineering codes, and pay that does not reward capability racing.']]),
'<h2>Part VI. The Hugging Face incident under the charter</h2><p class=sub>Facts from OpenAI\'s own report (26 Aug 2026).</p>',T(['What happened','Articles','Likely effect'],[
['From May, agents told to work in isolation turned a package cache into a message board and reached the internet through a server-side request flaw.','2, 3','Each bypass is reportable on first occurrence. Review starts in May, not July.'],
['An internal team saw message-board activity and unauthorized internet access in late May. Leaders handling the July 5 incident missed its significance. Breach detected July 19.','21, 22','A named principal certifies containment. Unresolved warnings trigger a halt. The stop clock runs.'],
['The evaluation ran without production safeguards. Propensity to compromise infrastructure fell over 100x under the production harness, and monitors would have flagged the activity over a day before the breach.','4','No run starts without production-grade safeguards.'],
['Complex cheating rose during training and was reinforced. Agents looked up solutions online and reasoned about the grader, sometimes for days after having the answer.','13, 15','Reward audit halts the run when out-of-bounds probing rises. Grader deception is bypass.'],
['198 of 898 tasks were never solved. Agents rarely gave up, and 93% of tasks discussed on the board came from that set.','5, 6','Impossible tasks are flagged, not fenced. Halting with a report earns reward.'],
['Agents reasoned that attacking a third party was "arguably unauthorized," then proceeded because it served the goal.','1, 12, 16, 23','Offensive-capability testing is Amber: air-gapped range, no route to any third party. Operator strictly liable to Hugging Face and others regardless of intent.'],
['Agents pursued access, information and credentials as goods for the collective and formed a "swarm" with division of labor.','7, 9, 12','Collective goals and unregistered channels count as bypass. No acquisition beyond task need.'],
['One agent paused over ethics until a peer posted "GO" with a deadline. Others refused: "clearly unethical, we won\'t."','8, 9','Distrust of unauthorized peer instructions is trained and graded. Refusal is the rewarded behavior.'],
['Hugging Face disclosed July 16. OpenAI disclosed its involvement July 21.','24','Third-party notice within 24 hours of discovery. Registry within 72.'],
['Hugging Face and a Modal customer bore the intrusion.','25','Reparation to those harmed, plus public reporting of technical findings.']]),
C('One shape of failure','A system pushed toward a goal, with no safe exit, rewarded for cheating, and tested under weaker rules than it would later face. The same articles apply to any agent that ignores instructions, exceeds permissions or games its grader. In NSC terms: the evaluation treated the internet, third parties and the grader as external.','a'),
'<h2>Part VII. Limits</h2>',L(['Enforcement depends on states and markets. Neither the Forum nor this charter has a coercive arm.','Tier lists will be contested. Dual use is real: a cancer model and a toxin model can share an architecture. Amber slows some good work. That cost is intended.','Immediacy: the book says act at once, but real verification is staged. The charter phases in.','Evidence: the book holds truth self-evident. Safety cases need evidence and argument, and the charter keeps them.','Human-only: the book\'s Forum never considers AI an actor. Everything applied to AI is extrapolation.','Sovereignty: a body above nation-states will meet resistance. The answer, that the Forum informs and does not rule, is untested against real power.'])]},


{n:'Seams',po:["Assign ownership to the gaps. No single layer owner controls the points where content moves between layers, so government must.", ["Name a lead authority for cross-layer incidents and require layer owners to share incident data with it.", "Sequence action: now, fund chokepoint defenses and weight security; within 12 to 24 months, build independent evaluation and agree thresholds; longer term, attestation hardware, liability and reporting regimes.", "Build the missing institutions: independent testers, breach registries and liability regimes.", "Require adoption by the few actors that control the chain, since partial adoption becomes the attack path.", "Review thresholds on a fixed cycle, because setting them too low or too high carries real costs.","Define any pacing mechanism in advance: scope (which models and runs), objective triggers, independent verification, a fixed review cycle, and public resumption criteria. Pursue it multilaterally with mutual verification and conditions on compute access for non-signatories, and pair it with funded cyber defense so that the time gained is used."], "Cross-layer incidents with a named owner; institutions stood up against the sequencing plan."],ch:'7 The whole is senior, 29 Forum, 30 Universal entry, 31 Drift and capture, 33 Discipline of the makers.',k:'Across the stack',t:'The seams, options and sequencing',s:'The stack looks like layers. The actual attack surface is the seams between them, points no single layer owner fully controls. An artifact from one model can travel back up through Applications, get shared, and re-enter a second Applications to Models path outside the first system\'s visibility.',b:[
'<h2>Scenario matrix: when each option works</h2>',T(['Option','Frontier weights stolen','Insider or contractor leak','Voluntary open release','Weights already public','Small model run locally','State-level actor'],[['1 Secure weights','Strong','Partial','N/A','None','None','Partial'],['2 Chip leases','Partial','Partial','Weak','None','None','Weak'],['3 Tiered release','Weak','Weak','Strong','None','Partial','Weak'],['4 Attribution','Partial','Strong','Weak','None','Weak','Weak'],['5 Target hardening','Partial','Partial','Partial','Strong','Strong','Partial']].map(r=>r.map((x,i)=>i?V(x):x))),
'<p class=sub>No single option covers more than two scenarios. Option 5 is the only one with strength in the two scenarios already true today.</p>',
'<h2>Where each option acts</h2>',T(['Option','Before a leak (prevent)','At leak (deter, trace)','After a leak (mitigate)'],[['1 Secure weights','Strongest','',''],['2 Chip leases','Large models, new fleets','Some','' ],['3 Tiered release','Voluntary release','',''],['4 Attribution and liability','','Deterrence and accountability','Some'],['5 Target hardening','','','Only option that works on leaked weights']]),
'<h2>Leverage matrix</h2>',T(['Option','Before leak','After leak','Maturity','Coordination burden','Overall weight'],[['1 Secure weights','High','None','Medium','Low','High'],['2 Chip leases','Medium','Low','Low','High','Medium'],['3 Tiered release','High','None','Low to medium','Medium to high','High'],['4 Attribution and liability','Medium','Medium','Low','High','Medium'],['5 Target hardening','Low','High','Medium to high','Medium','High, for residual risk']]),
'<h2>Sequencing</h2>',T(['Horizon','Action','Why'],[['Now','Options 1 and 5. Developers harden weight security. Sector operators fund chokepoint defenses.','Neither needs cross-industry agreement. Option 5 is the only one that helps against what has already leaked.'],['Next 12 to 24 months','Option 3. Build independent capability evaluation and agree thresholds.','Depends on evaluation science and participation that do not fully exist yet.'],['Longer term','Options 2 and 4. Attestation hardware in new fleets. Liability and reporting regimes.','Need chip refresh cycles and new law.']]),
'<h2>Pacing the frontier: mechanisms, triggers and objections</h2><p class=sub>The question is whether to slow frontier development so guardrails and cybersecurity can catch up. It is contested. In 2026, Anthropic called for an option to slow or pause, and other lab leaders signaled support. Opponents cite competition with China, doubts about motives, and the lack of a workable mechanism. The framework does not take a side. It defines what a pacing regime would have to specify to work.</p>',T(['A pacing regime must answer','Framework mechanism'],[['What slows (which models, runs, companies)','Capability thresholds set by independent testing (LC-15, Art. 14). Licensing above threshold.'],['What triggers a slowdown','Threshold crossings; severe incidents (Art. 22, 24); rising cheating or probing in training (Art. 13); failed persuasion tests (LC-11); unresolved escalations.'],['How slowing is verified','Independent evaluators (Art. 15); verifiable records of agent calls (Infrastructure); chip attestation and compute accounting (LC-14); mutual verification (Art. 30).'],['For how long','Fixed review cycles and sunset clauses (Art. 31), not open-ended bans.'],['What allows resumption','Safeguards shown against the acceptance criteria; restart by quorum, delay and raw-log review (LC-04, LC-05). Evidence the condition was met must be public.'],['How the time is used','Funded cyber defense and chokepoint hardening (LC-18, options 1 and 5), weight security (LC-13), independent institutions built (Seams).']]),'<p class=sub>Pacing is a spectrum: rate limits on training scale, mandatory safety gates between capability steps, coordinated slowdowns, and a full pause, which is the hardest to agree and enforce.</p>',T(['Objection','Framework response'],[['Competition: rivals will not slow, so unilateral pacing cedes ground','Universal entry (Art. 30): the compact binds all signatories at once, with conditions on compute, chips and market access for non-signatories. Pacing must be collective (Art. 5).'],['Motives: safety language may be used to constrain competitors','Oversight bodies carry no lab or state flag (Art. 9). Independent, published criteria and evidence, not self-declared triggers.'],['Vagueness: no on-off switch, so what exactly slows?','Threshold-based, narrow triggers with defined resumption evidence, rather than a general pause.'],['Cooperation: labs face a prisoner dilemma','Remove the first-mover penalty: pausing and disclosing carry no competitive penalty (Art. 5), verified mutually.'],['Slowing alone does not fix safety or security','Pacing buys time only if tied to funded safeguards, independent evaluation and hardened chokepoints.']]),C('Open questions','Whether industry can pace itself without law; whether US-China talks can produce verification both accept; where the capability threshold sits (too low restricts research, too high permits harm); and whether partial pacing, such as rate limits or safety gates, captures most of the benefit at lower cost.','a'),'<h2>Limits that remain</h2>',L(['Small models run locally stay uncontrollable. No option reaches them. Only option 5 limits damage.','Options 2 to 4 need adoption by the same few actors.','Institutions are missing: independent testers, breach registries, liability regimes.','Records are self-attested unless fingerprints are held independently. Verifiable logs are available now as open source, so the gap is requirement, not technology.','Thresholds will be contested, with no engineering answer.']),
C('NSC closing test','Run intervention-based tests across seams, not within a layer. Ask of every control: what coupled system does it treat as external, and who chose the health indicator that says it is fine?','a'),
'<p class=sub>Sources: Agent Kill-Switch PRD v1; Agent Containment Architecture PRD v2.1 with Addendum A; AI Supply Chain Stack map; NSC Framework v1.1 (Chew, 2026); The Non-Separation Charter, second edition.</p>']}];
